name: Fetch SINAICA data

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run scripts/fetch_sinaica.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data/sinaica.json
          git diff --cached --quiet || git commit -m "datos: actualizar lecturas SINAICA $(date -u +%Y-%m-%dT%H:%M)"
          git push
